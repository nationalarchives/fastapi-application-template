[tool.poetry]
package-mode=false

[tool.poetry.dependencies]
python = "~3.15"
requests = "~2.34"
fastapi = {extras = ["standard"], version = "~0.162"}
tna-utilities = "~1.9"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "~9.2"
requests-mock = "~1.12"
httpx = "~0.28"

[tool.pytest.ini_options]
testpaths = [
    "test",
]
